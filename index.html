<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Emily King Event Star">
    <meta name="theme-color" content="#87CEEB">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-startup-image" href="splash.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Emily King Event Star</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #87CEEB;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            border: 2px solid #000;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }
        #score {
            font-size: 24px;
            margin: 10px 0;
            color: #000;
            font-family: Arial, sans-serif;
        }
        @media (max-width: 500px) {
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
        #initials-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px 32px;
            border-radius: 12px;
            z-index: 10;
            width: 260px;
        }
        #initials-overlay h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }
        #initials-overlay p {
            margin: 0 0 16px 0;
            font-size: 14px;
            color: #ffd700;
        }
        #initials-input {
            font-size: 28px;
            font-family: Arial, sans-serif;
            width: 80px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid #ffd700;
            border-radius: 6px;
            background: #222;
            color: white;
            padding: 4px 8px;
            letter-spacing: 6px;
        }
        #initials-submit {
            display: block;
            margin: 16px auto 0;
            padding: 10px 28px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #initials-submit:hover { background: #ffe855; }
    </style>
</head>
<body>
    <div id="score"><span id="game-title">Emily King Event Star</span> — Score: <span id="score-value">0</span></div>
    <div id="initials-overlay">
        <h2>New High Score!</h2>
        <p id="initials-score-label"></p>
        <input id="initials-input" type="text" maxlength="5" placeholder="ABCDE" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button id="initials-submit">Save</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window._supabase = supabase.createClient(
        'https://bjcejpzstslbvyjkrwwz.supabase.co',
        'sb_publishable_7AHjGBUFetEZd5RBNkJukw_b_MdLhLK'
      );
    </script>
    <script src="game.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js');
        });
      }
    </script>
</body>
</html>
